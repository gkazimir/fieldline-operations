name: Fieldline CI/CD

on:
  push:
    branches:
      - main
      - test
      - development
      - feature-*
      - feature/**
      - fix-*
      - fix/**
  pull_request:
    branches:
      - main
      - test
      - development

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Lint check
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Validate environment Helm chart
        if: ${{ github.event_name == 'pull_request' || contains(fromJSON('["main", "test", "development"]'), github.ref_name) }}
        env:
          CHART_ENV: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          helm lint "kubernetes/$CHART_ENV"
          helm template fieldline-operations "kubernetes/$CHART_ENV"
  build-and-publish:
    if: ${{github.event_name == 'push' && contains(fromJSON('["main", "test", "development"]'), github.ref_name)}}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Buildx setup
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository}}:${{ github.ref_name }}
            ghcr.io/${{ github.repository}}:${{ github.sha }}
  deploy:
    needs: validate
    if: ${{github.event_name == 'push' && github.ref_name == 'development'}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Angular build
        run: npm run build -- --base-href=/fieldline-operations/
      - name: Create SPA fallback
        run: cp dist/fieldline-operations/browser/index.html dist/fieldline-operations/browser/404.html
      - name: Configure pages
        uses: actions/configure-pages@v5
      - name: Upload pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/fieldline-operations/browser
      - name: Deploy pages
        uses: actions/deploy-pages@v4
        id: deployment
