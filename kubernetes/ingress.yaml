apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fieldline-operations-ingress
spec:
  rules:
    - host: fieldline-operations.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fieldline-operations-service
                port:
                  number: 80
